name: Deploy to Hostinger

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Laravel application
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deploy revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build frontend assets on GitHub runner
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend assets
        run: npm run build

      - name: Configure SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_SSH_KEY" > "$HOME/.ssh/hostinger_deploy"
          chmod 600 "$HOME/.ssh/hostinger_deploy"
          ssh-keyscan -p "${{ secrets.HOSTINGER_SSH_PORT }}" -H "$HOSTINGER_SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Upload built frontend assets
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          BUILD_ARCHIVE="/tmp/wecare-build-${DEPLOY_SHA}.tar.gz"
          tar -C public -czf - build | ssh -i "$HOME/.ssh/hostinger_deploy" \
            -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" "cat > '$BUILD_ARCHIVE'"

      - name: Deploy over SSH
        env:
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
          PUBLIC_PATH: ${{ secrets.HOSTINGER_PUBLIC_PATH }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/hostinger_deploy" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- $(printf '%q' "$APP_PATH") $(printf '%q' "$DEPLOY_SHA") $(printf '%q' "$PUBLIC_PATH") $(printf '%q' "/tmp/wecare-build-$DEPLOY_SHA.tar.gz")" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          APP_PATH="$1"
          DEPLOY_SHA="$2"
          PUBLIC_PATH="${3:-}"
          BUILD_ARCHIVE="${4:-}"
          REPOSITORY="https://github.com/hidecard/WeCare_MM.git"

          if [ -z "$APP_PATH" ] || [ "$APP_PATH" = "/" ]; then
              echo "Refusing to deploy with an unsafe HOSTINGER_APP_PATH: '$APP_PATH'"
              exit 1
          fi

          if [ -d "$APP_PATH/.git" ]; then
              cd "$APP_PATH"
              git fetch --prune origin main
              git checkout main
              git reset --hard origin/main
          elif [ ! -e "$APP_PATH" ]; then
              mkdir -p "$(dirname "$APP_PATH")"
              git clone --branch main --depth 1 "$REPOSITORY" "$APP_PATH"
              cd "$APP_PATH"
          elif [ -z "$(find "$APP_PATH" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              git clone --branch main --depth 1 "$REPOSITORY" "$APP_PATH"
              cd "$APP_PATH"
          else
              echo "Refusing to deploy into a non-empty directory without a Git checkout: $APP_PATH"
              exit 1
          fi

          if [ -n "$BUILD_ARCHIVE" ] && [ -f "$BUILD_ARCHIVE" ]; then
              tar -xzf "$BUILD_ARCHIVE" -C public
              rm -f "$BUILD_ARCHIVE"
          fi

          if [ ! -f .env ]; then
              echo "Missing production .env at $APP_PATH/.env; refusing to continue."
              exit 1
          fi

          command -v composer >/dev/null || { echo "Composer is not available on the Hostinger account."; exit 1; }

          PHP_BIN=""
          for candidate in php8.4 php84 ea-php84 /opt/alt/php84/usr/bin/php; do
              if command -v "$candidate" >/dev/null 2>&1; then
                  PHP_BIN="$(command -v "$candidate")"
                  break
              fi
          done

          if [ -z "$PHP_BIN" ] && command -v php >/dev/null 2>&1; then
              if php -r 'exit(version_compare(PHP_VERSION, "8.4.1", ">=") ? 0 : 1);'; then
                  PHP_BIN="$(command -v php)"
              fi
          fi

          if [ -z "$PHP_BIN" ]; then
              echo "PHP 8.4.1+ CLI is required by composer.lock."
              echo "Select PHP 8.4 in Hostinger or enable php8.4/php84 for SSH commands."
              exit 1
          fi

          echo "Using PHP: $PHP_BIN ($($PHP_BIN -r 'echo PHP_VERSION;'))"

          "$PHP_BIN" "$(command -v composer)" install --no-dev --no-interaction --prefer-dist --optimize-autoloader

          if command -v npm >/dev/null; then
              npm ci --ignore-scripts
              npm run build
          fi

          if [ ! -f public/build/manifest.json ]; then
              echo "Frontend build manifest is missing at $APP_PATH/public/build/manifest.json"
              echo "The deployment cannot serve Laravel Vite assets."
              exit 1
          fi

          "$PHP_BIN" artisan migrate --force
          "$PHP_BIN" artisan storage:link || test -L public/storage
          "$PHP_BIN" artisan optimize:clear

          # Create the configured administrator only when missing; preserve existing passwords.
          "$PHP_BIN" artisan wecare:bootstrap-admin --ensure

          # Hostinger commonly keeps the domain document root at public_html.
          # Keep the complete Laravel application in APP_PATH and mirror only
          # public web assets into public_html. Never copy .env, app/, vendor/,
          # database/, or storage data into the web root.
          if [ -z "$PUBLIC_PATH" ]; then
              PUBLIC_PATH="$(dirname "$APP_PATH")/public_html"
          fi

          if [ "$PUBLIC_PATH" = "$APP_PATH" ] || [ "$PUBLIC_PATH" = "$APP_PATH/public" ]; then
              echo "Using Laravel public directory directly: $PUBLIC_PATH"
          else
              mkdir -p "$PUBLIC_PATH"

              for item in public/* public/.[!.]*; do
                  [ -e "$item" ] || continue
                  [ "$(basename "$item")" = "storage" ] && continue
                  cp -a "$item" "$PUBLIC_PATH/"
              done

              if [ -e "$PUBLIC_PATH/storage" ] && [ ! -L "$PUBLIC_PATH/storage" ]; then
                  echo "Refusing to replace a real public_html/storage directory."
                  echo "Move it aside after confirming it contains no unique uploads."
                  exit 1
              fi
              rm -f "$PUBLIC_PATH/storage"
              ln -s "$APP_PATH/storage/app/public" "$PUBLIC_PATH/storage"

              APP_RELATIVE_PATH="$(realpath --relative-to="$PUBLIC_PATH" "$APP_PATH")"
              cat > "$PUBLIC_PATH/index.php" <<PHP
          <?php

          use Illuminate\Foundation\Application;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          if (file_exists(\$maintenance = __DIR__.'/$APP_RELATIVE_PATH/storage/framework/maintenance.php')) {
              require \$maintenance;
          }

          require __DIR__.'/$APP_RELATIVE_PATH/vendor/autoload.php';

          /** @var Application \$app */
          \$app = require_once __DIR__.'/$APP_RELATIVE_PATH/bootstrap/app.php';

          \$app->handleRequest(Request::capture());
          PHP
          fi

          echo "Deployment completed for commit $DEPLOY_SHA"
          echo "Persistent files were preserved: .env, storage/, and vendor/ were not cleaned."
          echo "Public web root synchronized to: $PUBLIC_PATH"
          REMOTE_SCRIPT

      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/hostinger_deploy"
